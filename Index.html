<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>HHAI</title>
<style>
  :root {
    --bg: #212121;
    --sidebar-bg: #171717;
    --surface-1: #2f2f2f;
    --surface-2: #303030;
    --surface-3: #3a3a3a;
    --user-bubble: #303030;
    --text: #ececec;
    --text-dim: #b4b4b4;
    --muted: #8e8e8e;
    --accent: #ececec;
    --accent-on: #212121;
    --border: #2f2f2f;
    --border-light: #3a3a3a;
    --danger: #ff6b6b;
    --warn: #ffb84d;
    --code-bg: #0d0d0d;
    --code-border: #2f2f2f;
    --radius-xl: 26px;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  body.light-theme {
    --bg: #ffffff;
    --sidebar-bg: #f9f9f9;
    --surface-1: #f4f4f4;
    --surface-2: #ececec;
    --surface-3: #e0e0e0;
    --user-bubble: #f4f4f4;
    --text: #0d0d0d;
    --text-dim: #5d5d5d;
    --muted: #8e8e8e;
    --accent: #0d0d0d;
    --accent-on: #ffffff;
    --border: #ececec;
    --border-light: #e0e0e0;
    --code-bg: #f7f7f7;
    --code-border: #ececec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 16px; overflow: hidden;
    transition: background 0.25s, color 0.25s;
  }

  .header {
    position: fixed; top: 0; left: 0; right: 0;
    height: calc(52px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; gap: 2px;
    padding-left: 6px; padding-right: 6px;
    background: var(--bg);
    z-index: 20;
  }
  .header .spacer { flex: 1; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: transparent; border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { background: var(--surface-3); }

  .plus-btn {
    border: 1px solid var(--border-light);
    border-radius: 8px;
  }
  .plus-btn:hover { border-color: var(--muted); }

  .header-title {
    font-size: 15px; font-weight: 600;
    color: var(--text); padding: 0 8px;
    letter-spacing: 0.1px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }

  .sidebar {
    position: fixed; top: 0; left: 0; width: 300px; height: 100%;
    background: var(--sidebar-bg); z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
    padding-top: env(safe-area-inset-top);
    display: flex; flex-direction: column;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 0.28s;
  }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

  .chat-list { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .chat-item {
    padding: 14px 16px; border-radius: 10px;
    margin-bottom: 4px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px;
    color: var(--text);
    transition: background 0.15s;
    gap: 10px;
  }
  .chat-item:hover { background: var(--surface-2); }
  .chat-item.active { background: var(--surface-3); font-weight: 500; }
  .chat-item .title {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-item .delete-chat {
    color: var(--muted); background: none; border: none;
    font-size: 18px; cursor: pointer; padding: 2px 6px;
    border-radius: 6px; display: none; line-height: 1;
  }
  .chat-item:hover .delete-chat { display: block; }
  .chat-item .delete-chat:hover { background: var(--surface-3); color: var(--danger); }

  .sidebar-footer {
    padding: 12px 10px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .sidebar-footer button {
    width: 100%; padding: 14px 16px; background: transparent;
    border: none; color: var(--text); font-size: 15px;
    cursor: pointer; text-align: left; display: flex;
    align-items: center; gap: 10px; border-radius: 10px;
    transition: background 0.15s;
  }
  .sidebar-footer button:hover { background: var(--surface-2); }

  .messages {
    position: absolute;
    top: calc(52px + env(safe-area-inset-top));
    bottom: calc(170px + env(safe-area-inset-bottom));
    left: 0; right: 0; overflow-y: auto;
    padding: 20px 16px 8px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text);
    padding: 0 20px;
    animation: fadeIn 0.4s ease;
  }
  .welcome-screen h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 16px 0;
    background: linear-gradient(90deg, #ececec, #a0a0a0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  body.light-theme .welcome-screen h1 {
    background: linear-gradient(90deg, #0d0d0d, #5d5d5d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome-screen p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 400px;
    margin: 0;
  }

  .row {
    display: flex; margin-bottom: 24px;
    animation: fadeIn 0.2s ease;
    gap: 10px;
    align-items: flex-start;
    position: relative;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface-3);
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 12px; font-weight: 600;
    flex-shrink: 0; margin-top: 2px;
  }

  .bubble {
    max-width: 85%; padding: 12px 16px;
    border-radius: var(--radius-xl); line-height: 1.65;
    font-size: 16.5px; word-wrap: break-word; white-space: pre-wrap;
    position: relative; cursor: pointer;
    transition: background 0.15s;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 6px;
  }
  .row.bot .bubble {
    background: transparent; padding: 3px 0 0; max-width: 92%;
    line-height: 1.7;
  }

  .msg-actions {
    display: none;
    gap: 6px; margin-top: 10px;
    flex-wrap: wrap; align-items: center;
  }
  .msg-actions.visible { display: flex; }

  .action-btn {
    background: transparent; border: 1px solid var(--border-light);
    color: var(--text-dim); padding: 5px 11px;
    border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
    line-height: 1.2;
  }
  .action-btn:hover { background: var(--surface-2); color: var(--text); }
  .action-btn:active { background: var(--surface-3); }

  .code-block {
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: var(--radius-md); margin: 14px 0;
    overflow: hidden; position: relative;
  }
  .code-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: var(--surface-2);
    border-bottom: 1px solid var(--code-border);
    font-size: 12px; color: var(--muted);
    font-family: monospace;
  }
  .code-header button {
    background: transparent; border: 1px solid var(--border-light);
    border-radius: 6px; color: var(--text);
    font-size: 11px; padding: 4px 10px; cursor: pointer;
    transition: background 0.15s;
  }
  .code-header button:hover { background: var(--surface-3); }
  .code-content {
    padding: 14px; overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
    color: #d4d4d4; white-space: pre;
  }
  body.light-theme .code-content { color: #2a2a2a; }

  .bubble img {
    max-width: 100%; border-radius: var(--radius-md);
    margin-top: 8px; display: block; cursor: pointer;
    transition: opacity 0.2s;
  }
  .bubble img:hover { opacity: 0.92; }
  .img-hint {
    font-size: 11px; color: var(--muted);
    margin-top: 6px; text-align: center;
  }

  .typing { display: inline-flex; gap: 5px; padding: 14px 4px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); opacity: 0.5;
    animation: blink 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  .edit-area {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--border-light); border-radius: var(--radius-md);
    color: var(--text); font-size: 16.5px; font-family: inherit;
    padding: 10px 12px; resize: vertical;
    min-height: 60px; outline: none; line-height: 1.55;
  }
  .edit-actions { display: flex; gap: 8px; margin-top: 8px; }

  .bottom-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 0 16px calc(6px + env(safe-area-inset-bottom));
    background: var(--bg);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center;
  }

  .status-line {
    height: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; color: var(--text-dim); font-weight: 500;
    opacity: 0; transition: opacity 0.3s;
    width: 100%; max-width: 720px;
  }
  .status-line.show { opacity: 1; }
  .status-line.error { color: var(--danger); opacity: 1; }
  .status-line .spinner-small {
    width: 10px; height: 10px;
    border: 2px solid var(--surface-3);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tools-panel {
    width: 100%; max-width: 720px;
    margin-bottom: 6px; display: flex; gap: 8px;
  }
  .tool-btn {
    background: transparent; border: 1px solid var(--border-light);
    color: var(--text-dim); padding: 6px 14px;
    border-radius: 999px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .tool-btn:hover { background: var(--surface-2); color: var(--text); }
  .tool-btn.active {
    background: var(--accent); color: var(--accent-on);
    border-color: var(--accent);
  }
  .tool-btn.disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  .tool-btn svg { width: 14px; height: 14px; }

  .composer-inner {
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--surface-2);
    border-radius: var(--radius-xl);
    padding: 6px 6px 6px 18px;
    width: 100%; max-width: 720px;
    transition: opacity 0.3s, background 0.3s;
  }
  .composer-inner.disabled {
    background: var(--surface-1);
  }
  .composer-inner.disabled .composer-btn {
    pointer-events: none;
    opacity: 0.5;
  }

  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; resize: none;
    max-height: 120px; padding: 10px 0;
    font-family: inherit; line-height: 1.5;
    transition: color 0.3s;
  }
  #input::placeholder { color: var(--muted); }
  
  #input.cooldown-active {
    color: var(--warn);
    font-weight: 500;
  }
  #input.cooldown-active::placeholder {
    color: var(--warn);
  }

  .composer-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    background: transparent; color: var(--text-dim);
  }
  .composer-btn:hover { background: var(--surface-3); }
  .composer-btn:active { transform: scale(0.92); }
  .composer-btn.recording {
    background: var(--danger); color: #fff;
  }
  .composer-btn svg { width: 18px; height: 18px; }

  .send-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    background: var(--accent); color: var(--accent-on);
    transition: transform 0.1s, opacity 0.15s;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled {
    background: var(--surface-3); color: var(--muted);
    cursor: not-allowed;
  }
  .send-btn svg { width: 18px; height: 18px; }
  .send-btn.stop { background: var(--danger); color: #fff; }

  .disclaimer {
    text-align: center; font-size: 11px;
    color: var(--muted); margin-top: 8px;
    line-height: 1.4; padding: 0 8px;
    width: 100%; max-width: 720px;
  }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--sidebar-bg); width: 100%; max-width: 460px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 6px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(.2,.8,.2,1); max-height: 88vh; overflow-y: auto; }
  .modal.show .modal-content { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--surface-3); margin: 8px auto 14px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 18px; color: var(--text); }
  .setting-item { margin-bottom: 20px; }
  .setting-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
  .setting-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .setting-options button { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-light); background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .setting-options button:hover { background: var(--surface-2); color: var(--text); }
  .setting-options button.active { background: var(--surface-3); color: var(--text); border-color: transparent; font-weight: 500; }
  .modal-close { width: 100%; padding: 12px; margin-top: 6px; border-radius: var(--radius-md); border: 1px solid var(--border-light); background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .modal-close:hover { background: var(--surface-2); color: var(--text); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: var(--radius-md); }
  .lightbox-actions { margin-top: 20px; display: flex; gap: 12px; }
  .lightbox-btn { padding: 12px 24px; border-radius: 999px; border: none; background: #2f2f2f; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  .lightbox-close { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  @media (max-width: 420px) {
    .bubble, .row.bot .bubble { font-size: 16px; }
    .row.user .bubble { max-width: 88%; }
    .welcome-screen h1 { font-size: 22px; }
    .welcome-screen p { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="sidebar" id="sidebar">
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <button id="settingsBtn">Настройки</button>
  </div>
</div>

<header class="header">
  <button class="icon-btn" id="menuBtn" aria-label="Меню">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>
  <span class="header-title" id="headerTitle">HHAI</span>
  <div class="spacer"></div>
  <button class="icon-btn plus-btn" id="clearBtn" aria-label="Новый чат" title="Новый чат">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</header>

<div class="messages" id="messages"></div>

<div class="bottom-panel">
  <div class="status-line" id="statusLine"></div>

  <div class="tools-panel">
    <button class="tool-btn" id="photoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Режим фото</span>
    </button>
  </div>

  <div class="composer-inner" id="composerInner">
    <textarea id="input" rows="1" placeholder="Сообщение..."></textarea>
    <button class="composer-btn" id="voiceBtn" aria-label="Голосовой ввод">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"/>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" type="button" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
  <div class="disclaimer">ИИ может ошибаться.</div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-handle"></div>
    <div class="modal-title">Настройки</div>

    <div class="setting-item">
      <label class="setting-label">Тема</label>
      <div class="setting-options" id="themeOptions">
        <button data-theme="dark">Тёмная</button>
        <button data-theme="light">Светлая</button>
        <button data-theme="auto">Системная</button>
      </div>
    </div>

    <div class="setting-item">
      <label class="setting-label">Текстовая модель</label>
      <div class="setting-options" id="textModelOptions">
        <button data-textmodel="pollinations">Pollinations (бесплатно)</button>
        <button data-textmodel="mistral">Mistral Agent (ключ)</button>
      </div>
    </div>

    <div class="setting-item">
      <label class="setting-label">Модель для фото</label>
      <div class="setting-options" id="modelOptions">
        <button data-model="flux">Flux (Реализм)</button>
        <button data-model="zimage">ZImage (Геометрия)</button>
        <button data-model="turbo">Turbo (Быстро)</button>
        <button data-model="gptimage">GPT Image</button>
      </div>
    </div>

    <button class="modal-close" id="closeSettings">Закрыть</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-actions">
    <button class="lightbox-btn" id="downloadBtn">Скачать</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== НАСТРОЙКИ КЛЮЧЕЙ =====
  const MISTRAL_API_KEY = 'mstrl_UoSQU5OnoWdc41zRNDAEaoVOjcw2pal6_37Gqi8';
  const MISTRAL_AGENT_ID = 'ag_01a1a7f14c2d70c185253308fe7e764a';

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const photoBtn = document.getElementById('photoBtn'); 
  const menuBtn = document.getElementById('menuBtn');
  const clearBtn = document.getElementById('clearBtn');
  const headerTitle = document.getElementById('headerTitle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const chatList = document.getElementById('chatList');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const closeSettings = document.getElementById('closeSettings');
  const statusLine = document.getElementById('statusLine');
  const composerInner = document.getElementById('composerInner');

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const downloadBtn = document.getElementById('downloadBtn');

  let chats = [];
  try { chats = JSON.parse(localStorage.getItem('hh_chats')) || []; } catch(e) { chats = []; }
  let currentChatId = null;
  let currentTheme = localStorage.getItem('hh_theme') || 'dark';
  let selectedModel = localStorage.getItem('hh_image_model') || 'flux';
  let selectedTextModel = localStorage.getItem('hh_text_model') || 'pollinations';

  const MAX_MESSAGES_PER_CHAT = 200;
  const MAX_CHATS = 50;
  const MAX_STORAGE_BYTES = 4 * 1024 * 1024;
  const IMG_COOLDOWN_MS = 45000;
  
  let currentAbort = null;
  let recognition = null;
  let isRecording = false;
  
  let cooldownInterval = null;
  let cooldownUntil = 0;
  
  let imgCooldownUntil = 0; 
  let isPhotoMode = false;
  let statusTimeout = null;
  
  let photoBtnInterval = null;

  function trimChat(chat) {
    if (chat.messages.length > MAX_MESSAGES_PER_CHAT) {
      chat.messages = chat.messages.slice(-MAX_MESSAGES_PER_CHAT);
    }
  }
  function enforceStorageLimits() {
    chats.forEach(trimChat);
    while (chats.length > MAX_CHATS) chats.pop();
    let serialized = JSON.stringify(chats);
    while (serialized.length > MAX_STORAGE_BYTES && chats.length > 1) {
      chats.pop();
      serialized = JSON.stringify(chats);
    }
    if (!chats.find(c => c.id === currentChatId) && chats.length > 0) {
      currentChatId = chats[0].id;
    }
  }
  function saveChats() {
    enforceStorageLimits();
    try {
      localStorage.setItem('hh_chats', JSON.stringify(chats));
    } catch (e) {
      while (chats.length > 1) {
        chats.pop();
        try {
          localStorage.setItem('hh_chats', JSON.stringify(chats));
          return;
        } catch (_) {}
      }
    }
  }

  function init() {
    enforceStorageLimits();
    applyTheme(currentTheme);
    if (chats.length === 0) {
      createNewChat();
    } else {
      if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
        currentChatId = chats[0].id;
      }
      loadChat(currentChatId);
    }
    updateSettingsUI();
    initVoice();
    setupSystemThemeListener();
    updatePhotoBtnState();
    startPhotoBtnTicker();
  }

  function applyTheme(theme) {
    const isLight = theme === 'light' ||
      (theme === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.body.classList.toggle('light-theme', isLight);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isLight ? '#ffffff' : '#212121');
  }
  function setupSystemThemeListener() {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', () => {
      if (currentTheme === 'auto') applyTheme('auto');
    });
  }

  function createNewChat() {
    stopGeneration();
    imgCooldownUntil = 0;
    isPhotoMode = false;
    photoBtn.classList.remove('active');
    updatePhotoBtnState();
    
    const newChat = {
      id: Date.now().toString(),
      title: "Новый чат",
      messages: [],
      autoTitled: false
    };
    chats.unshift(newChat);
    saveChats();
    currentChatId = newChat.id;
    renderChatList();
    loadChat(currentChatId);
    closeSidebar();
  }

  function loadChat(id) {
    stopGeneration();
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    currentChatId = id;
    messagesEl.innerHTML = '';
    headerTitle.textContent = chat.title === "Новый чат" ? "HHAI" : chat.title;

    if (chat.messages.length === 0) {
      const welcome = document.createElement('div');
      welcome.className = 'welcome-screen';
      welcome.innerHTML = `
        <h1>Добро пожаловать в HHAI</h1>
        <p>Я умею создавать фотографии и помогать вам с текстом.</p>
      `;
      messagesEl.appendChild(welcome);
    } else {
      chat.messages.forEach((msg, idx) => {
        if (msg.role === 'user') addUserMessage(msg.text, msg.img, idx);
        else addBotMessage(msg.text, msg.img, idx);
      });
    }
    renderChatList();
    scrollDown();
  }

  function renderChatList() {
    chatList.innerHTML = '';
    if (chats.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:20px;text-align:center;color:var(--muted);font-size:14px;';
      empty.textContent = 'Нет чатов';
      chatList.appendChild(empty);
      return;
    }

    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      const span = document.createElement('span');
      span.className = 'title';
      span.textContent = chat.title;
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-chat';
      delBtn.textContent = '×';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
      div.appendChild(span);
      div.appendChild(delBtn);
      div.onclick = () => { loadChat(chat.id); closeSidebar(); };
      chatList.appendChild(div);
    });
  }

  function deleteChat(id) {
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) {
      if (chats.length > 0) loadChat(chats[0].id);
      else createNewChat();
    } else {
      renderChatList();
    }
  }

  function updateChatTitle(text) {
    const chat = chats.find(c => c.id === currentChatId);
    if (chat && chat.title === "Новый чат") {
      chat.title = text.substring(0, 28) + (text.length > 28 ? '…' : '');
      headerTitle.textContent = chat.title;
      saveChats();
      renderChatList();
    }
  }

  function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); }

  menuBtn.onclick = openSidebar;
  sidebarOverlay.onclick = closeSidebar;
  clearBtn.onclick = createNewChat;

  settingsBtn.onclick = () => {
    settingsModal.classList.add('show');
    closeSidebar();
  };
  closeSettings.onclick = () => settingsModal.classList.remove('show');
  settingsModal.onclick = (e) => {
    if (e.target === settingsModal) settingsModal.classList.remove('show');
  };

  document.getElementById('themeOptions').onclick = (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    currentTheme = e.target.dataset.theme;
    localStorage.setItem('hh_theme', currentTheme);
    applyTheme(currentTheme);
    updateSettingsUI();
  };

  document.getElementById('textModelOptions').onclick = (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    selectedTextModel = e.target.dataset.textmodel;
    localStorage.setItem('hh_text_model', selectedTextModel);
    updateSettingsUI();
    showStatus(`Текстовая модель: ${selectedTextModel}`, false);
  };

  document.getElementById('modelOptions').onclick = (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    selectedModel = e.target.dataset.model;
    localStorage.setItem('hh_image_model', selectedModel);
    updateSettingsUI();
    showStatus(`Модель фото: ${selectedModel}`, false);
  };

  function updateSettingsUI() {
    document.querySelectorAll('#themeOptions button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === currentTheme);
    });
    document.querySelectorAll('#textModelOptions button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.textmodel === selectedTextModel);
    });
    document.querySelectorAll('#modelOptions button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.model === selectedModel);
    });
  }

  function showStatus(text, isError = false) {
    if (statusTimeout) clearTimeout(statusTimeout);
    statusLine.innerHTML = text;
    statusLine.className = 'status-line show' + (isError ? ' error' : '');
    if (isError) {
      statusTimeout = setTimeout(() => { statusLine.classList.remove('show', 'error'); }, 3000);
    } else {
      statusTimeout = setTimeout(() => { statusLine.classList.remove('show'); }, 2000);
    }
  }
  
  function hideStatus() { 
    if (statusTimeout) clearTimeout(statusTimeout);
    statusLine.classList.remove('show', 'error'); 
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function startTextCooldown(seconds = 30) {
    const ms = seconds * 1000;
    cooldownUntil = Date.now() + ms + 1000;
    composerInner.classList.add('disabled');
    inputEl.disabled = true;
    inputEl.classList.add('cooldown-active');
    
    if (cooldownInterval) clearInterval(cooldownInterval);
    
    function updateTimer() {
      const remaining = Math.ceil((cooldownUntil - Date.now()) / 1000);
      if (remaining > 0) {
        inputEl.placeholder = `Подожди ${remaining} сек...`;
      } else {
        stopCooldown();
      }
    }
    
    updateTimer();
    cooldownInterval = setInterval(updateTimer, 100);
  }
  
  function stopCooldown() {
    if (cooldownInterval) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
    }
    composerInner.classList.remove('disabled');
    inputEl.disabled = false;
    inputEl.classList.remove('cooldown-active');
    inputEl.placeholder = isPhotoMode ? "Опиши картинку..." : "Сообщение...";
  }

  function updatePhotoBtnState() {
    if (Date.now() < imgCooldownUntil) {
      photoBtn.disabled = true;
      photoBtn.classList.add('disabled');
    } else {
      photoBtn.disabled = false;
      photoBtn.classList.remove('disabled');
    }
  }

  function startPhotoBtnTicker() {
    if (photoBtnInterval) clearInterval(photoBtnInterval);
    photoBtnInterval = setInterval(() => {
      if (imgCooldownUntil > Date.now()) {
        updatePhotoBtnState();
      } else if (photoBtn.classList.contains('disabled')) {
        updatePhotoBtnState();
      }
    }, 1000);
  }

  photoBtn.onclick = () => {
    if (Date.now() < imgCooldownUntil) {
      const remaining = Math.ceil((imgCooldownUntil - Date.now()) / 1000);
      showStatus(`Кулдаун фото не прошел. Жди ${remaining} сек.`, true);
      return;
    }
    
    isPhotoMode = !isPhotoMode;
    if (isPhotoMode) {
      photoBtn.classList.add('active');
      if (!inputEl.disabled) inputEl.placeholder = "Опиши картинку...";
    } else {
      photoBtn.classList.remove('active');
      if (!inputEl.disabled) inputEl.placeholder = "Сообщение...";
    }
  };

  function initVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      voiceBtn.disabled = true;
      voiceBtn.style.opacity = '0.4';
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      inputEl.value = text;
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    };
    recognition.onerror = () => { stopRecording(); };
    recognition.onend = () => { stopRecording(); };
  }

  voiceBtn.onclick = () => {
    if (!recognition) return;
    if (isRecording) {
      recognition.stop();
    } else {
      try {
        recognition.start();
        isRecording = true;
        voiceBtn.classList.add('recording');
      } catch (e) {
        stopRecording();
      }
    }
  };

  function stopRecording() {
    isRecording = false;
    voiceBtn.classList.remove('recording');
  }

  function createImageElement(src) {
    const img = document.createElement('img');
    img.src = src;
    img.crossOrigin = 'anonymous';
    img.loading = 'lazy';
    img.onclick = (e) => { e.stopPropagation(); openLightbox(src); };
    return img;
  }

  function makeActionBtn(label, onClick) {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.textContent = label;
    btn.onclick = (e) => { e.stopPropagation(); onClick(); };
    return btn;
  }

  function addUserMessage(text, imgUrl, msgIndex) {
    const row = document.createElement('div');
    row.className = 'row user';
    const b = document.createElement('div');
    b.className = 'bubble';

    if (imgUrl) b.appendChild(createImageElement(imgUrl));
    if (text) {
      const span = document.createElement('div');
      span.textContent = text;
      b.appendChild(span);

      const actions = document.createElement('div');
      actions.className = 'msg-actions';

      const copyBtn = makeActionBtn('Копировать', () => {
        copyToClipboard(text, copyBtn, 'Копировать');
      });
      actions.appendChild(copyBtn);

      if (typeof msgIndex === 'number') {
        const editBtn = makeActionBtn('Изменить', () => {
          startEditMessage(b, text, msgIndex);
        });
        actions.appendChild(editBtn);
      }

      b.appendChild(actions);

      b.onclick = (e) => {
        if (e.target.closest('button') || e.target.tagName === 'IMG') return;
        actions.classList.toggle('visible');
      };
    }
    row.appendChild(b);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function startEditMessage(bubbleEl, oldText, msgIndex) {
    const chat = chats.find(c => c.id === currentChatId);
    if (!chat) return;
    const msg = chat.messages[msgIndex];
    if (!msg || msg.role !== 'user') return;

    bubbleEl.onclick = null;
    bubbleEl.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'edit-area';
    ta.value = oldText;
    bubbleEl.appendChild(ta);

    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    actions.style.display = 'flex';

    const saveBtn = makeActionBtn('Сохранить', async () => {
      const newText = ta.value.trim();
      if (!newText || newText === oldText) {
        loadChat(currentChatId);
        return;
      }
      chat.messages = chat.messages.slice(0, msgIndex);
      saveChats();
      inputEl.value = newText;
      loadChat(currentChatId);
      setTimeout(() => send(), 50);
    });

    const cancelBtn = makeActionBtn('Отмена', () => {
      loadChat(currentChatId);
    });

    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    bubbleEl.appendChild(actions);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  function renderRichText(container, text) {
    container.textContent = '';
    const parts = text.split(/(```[\s\S]*?```)/g);
    parts.forEach(part => {
      if (part.startsWith('```')) {
        const match = part.match(/```(\w*)\n?([\s\S]*?)```/);
        const lang = match ? match[1] : '';
        const code = match ? match[2] : part.slice(3, -3);

        const codeBlock = document.createElement('div');
        codeBlock.className = 'code-block';

        const header = document.createElement('div');
        header.className = 'code-header';
        const langSpan = document.createElement('span');
        langSpan.textContent = lang || 'code';
        header.appendChild(langSpan);

        const copyBtn = document.createElement('button');
        copyBtn.textContent = 'Копировать';
        copyBtn.onclick = (e) => { e.stopPropagation(); copyToClipboard(code, copyBtn, 'Копировать'); };
        header.appendChild(copyBtn);

        const content = document.createElement('div');
        content.className = 'code-content';
        content.textContent = code;

        codeBlock.appendChild(header);
        codeBlock.appendChild(content);
        container.appendChild(codeBlock);
      } else if (part) {
        const span = document.createElement('span');
        span.textContent = part;
        container.appendChild(span);
      }
    });
  }

  function addBotMessage(text, imgUrl, msgIndex) {
    const row = document.createElement('div');
    row.className = 'row bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'H';
    row.appendChild(avatar);

    const b = document.createElement('div');
    b.className = 'bubble';

    if (imgUrl) {
      b.appendChild(createImageElement(imgUrl));
      const hint = document.createElement('div');
      hint.className = 'img-hint';
      hint.textContent = 'Нажми, чтобы скачать';
      b.appendChild(hint);
    }

    if (text) {
      const textContainer = document.createElement('div');
      textContainer.className = 'text-content';
      renderRichText(textContainer, text);
      b.appendChild(textContainer);
      
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = makeActionBtn('Копировать', () => copyToClipboard(text, copyBtn, 'Копировать'));
      actions.appendChild(copyBtn);
      if (typeof msgIndex === 'number') {
        const regenBtn = makeActionBtn('Заново', () => regenerateFrom(msgIndex));
        actions.appendChild(regenBtn);
      }
      b.appendChild(actions);
    }

    b.onclick = (e) => {
      if (e.target.closest('button') || e.target.tagName === 'IMG') return;
      const actions = b.querySelector('.msg-actions');
      if (actions) actions.classList.toggle('visible');
    };

    row.appendChild(b);
    messagesEl.appendChild(row);
    scrollDown();
    return b;
  }

  function copyToClipboard(text, btn, originalLabel) {
    const done = () => {
      btn.textContent = 'Скопировано';
      setTimeout(() => btn.textContent = originalLabel, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch(e) {}
    document.body.removeChild(ta);
  }

  function regenerateFrom(botMsgIndex) {
    const chat = chats.find(c => c.id === currentChatId);
    if (!chat) return;
    let userIndex = -1;
    for (let i = botMsgIndex - 1; i >= 0; i--) {
      if (chat.messages[i] && chat.messages[i].role === 'user') {
        userIndex = i;
        break;
      }
    }
    if (userIndex < 0) return;
    const userText = chat.messages[userIndex].text;
    chat.messages = chat.messages.slice(0, userIndex);
    saveChats();
    loadChat(currentChatId);
    inputEl.value = userText;
    setTimeout(() => send(), 50);
  }

  async function send() {
    if (!isPhotoMode && cooldownUntil > Date.now()) {
      const remaining = Math.ceil((cooldownUntil - Date.now()) / 1000);
      showStatus(`Подожди ${remaining} сек.`, true);
      return;
    }

    const text = inputEl.value.trim();
    if (!text) return;

    const chat = chats.find(c => c.id === currentChatId);
    if (!chat) return;

    if (isPhotoMode && Date.now() < imgCooldownUntil) {
      const remaining = Math.ceil((imgCooldownUntil - Date.now()) / 1000);
      showStatus(`Кулдаун фото не прошел. Жди ${remaining} сек.`, true);
      return;
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';

    if (chat.messages.length === 0) {
      messagesEl.innerHTML = '';
    }

    chat.messages.push({ role: 'user', text: text });
    updateChatTitle(text);
    saveChats();

    loadChat(currentChatId);

    if (isPhotoMode) {
      isPhotoMode = false;
      photoBtn.classList.remove('active');
      await generateImage(text, chat);
    } else {
      await generateText(text, chat);
    }
  }

  // ===== ГЕНЕРАЦИЯ ТЕКСТА =====
  async function generateText(text, chat) {
    setSendButtonStop(true);

    const row = document.createElement('div');
    row.className = 'row bot';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'H';
    row.appendChild(avatar);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const textContainer = document.createElement('div');
    textContainer.className = 'text-content';

    const typingIndicator = document.createElement('div');
    typingIndicator.className = 'typing';
    typingIndicator.innerHTML = '<span></span><span></span><span></span>';
    textContainer.appendChild(typingIndicator);

    bubble.appendChild(textContainer);
    row.appendChild(bubble);
    messagesEl.appendChild(row);

    showStatus("Думаю...");

    const myChatId = currentChatId;
    const myAbort = new AbortController();
    currentAbort = myAbort;

    let fullText = '';
    let receivedFirstChunk = false;

    try {
      const history = chat.messages.map(m => ({ role: m.role, content: m.text }));

      const onDelta = (delta) => {
        if (!delta) return;
        if (currentChatId !== myChatId) return;

        if (!receivedFirstChunk) {
          receivedFirstChunk = true;
          hideStatus();
          if (typingIndicator.parentNode) typingIndicator.remove();
        }

        fullText += delta;

        const fenceCount = (fullText.match(/```/g) || []).length;
        let visible;
        if (fenceCount % 2 === 1) {
          const lastFence = fullText.lastIndexOf('```');
          visible = fullText.substring(0, lastFence);
        } else {
          visible = fullText;
        }

        renderRichText(textContainer, visible);
        scrollDown();
      };

      if (selectedTextModel === 'mistral') {
        await getMistralResponse(text, history, myAbort.signal, onDelta);
      } else {
        await streamPollinationsResponse(text, history, myAbort.signal, onDelta);
      }

      if (currentChatId !== myChatId) return;
      if (typingIndicator.parentNode) typingIndicator.remove();

      const answer = stripMarkdown(fullText);

      if (!answer || !answer.trim()) {
        row.remove();
        addBotMessage('Сервер вернул пустой ответ. Попробуй ещё раз или смени модель в настройках.', null, null);
        hideStatus();
        currentAbort = null;
        setSendButtonStop(false);
        return;
      }

      renderRichText(textContainer, answer);

      hideStatus();
      currentAbort = null;
      setSendButtonStop(false);

      chat.messages.push({ role: 'assistant', text: answer });
      saveChats();

      const msgIndex = chat.messages.length - 1;
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = makeActionBtn('Копировать', () => copyToClipboard(answer, copyBtn, 'Копировать'));
      actions.appendChild(copyBtn);
      const regenBtn = makeActionBtn('Заново', () => regenerateFrom(msgIndex));
      actions.appendChild(regenBtn);
      bubble.appendChild(actions);

      bubble.onclick = (e) => {
        if (e.target.closest('button') || e.target.tagName === 'IMG') return;
        actions.classList.toggle('visible');
      };

      scrollDown();

    } catch (e) {
      if (typingIndicator.parentNode) typingIndicator.remove();
      hideStatus();
      currentAbort = null;
      setSendButtonStop(false);

      if (e.name === 'AbortError') {
        if (fullText.trim() && currentChatId === myChatId) {
          const partial = stripMarkdown(fullText) + '\n\n[остановлено]';
          renderRichText(textContainer, partial);
          chat.messages.push({ role: 'assistant', text: stripMarkdown(fullText) });
          saveChats();
        } else {
          row.remove();
          if (currentChatId === myChatId) addBotMessage('Остановлено.', null, null);
        }
      } else if (e.message && e.message.startsWith('ЛИМИТ_')) {
        row.remove();
        const sec = parseInt(e.message.split('_')[1], 10) || 30;
        startTextCooldown(sec);
        if (currentChatId === myChatId) {
          addBotMessage(`Лимит запросов. Подожди ${sec} сек.`, null, null);
        }
      } else {
        row.remove();
        if (currentChatId === myChatId) {
          addBotMessage(`Ошибка: ${e.message}`, null, null);
        }
      }
    }
  }

  // ===== POLLINATIONS (со стримингом и фолбэком) =====
  async function streamPollinationsResponse(text, history, signal, onDelta) {
    const recentHistory = history.slice(-12);

    const systemContent =
      "Ты — HHAI. Общайся как живой человек: просто, по делу, без канцелярита. " +
      "Отвечай на русском. Не используй Markdown-разметку (**, *, #, таблицы). " +
      "Списки — через дефис с новой строки. Не используй эмодзи. " +
      "Не начинай с 'Конечно!', 'Отличный вопрос!' и подобного. " +
      "Отвечай развёрнуто: обычно 2-4 абзаца или 4-8 пунктов списка, если тема требует объяснения. " +
      "Коротко — только на простые фактические вопросы. " +
      "Код — в блоке ``` с указанием языка. " +
      "Ты не нарушаешь закон и не помогаешь нарушать его.";

    const requestBody = {
      model: "openai",
      messages: [{ role: "system", content: systemContent }, ...recentHistory],
      private: true
    };

    let gotChunk = false;
    try {
      const response = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...requestBody, stream: true }),
        signal
      });

      if (response.status === 429 || response.status === 402) {
        const retryAfter = response.headers.get('Retry-After');
        const waitSeconds = retryAfter ? parseInt(retryAfter, 10) : 30;
        throw new Error(`ЛИМИТ_${waitSeconds}`);
      }
      if (!response.ok) throw new Error(`Сервер: ${response.status}`);

      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        const data = await response.json();
        const content = data.choices?.[0]?.message?.content;
        if (content) {
          onDelta(content);
          gotChunk = true;
          return;
        }
        throw new Error('Пустой ответ');
      }

      await readSSEStream(response, (delta) => {
        gotChunk = true;
        onDelta(delta);
      });

    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (e.message && e.message.startsWith('ЛИМИТ_')) throw e;
      if (gotChunk) throw e;
    }

    if (!gotChunk) {
      const fallbackResp = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody),
        signal
      });

      if (fallbackResp.status === 429 || fallbackResp.status === 402) {
        throw new Error(`ЛИМИТ_30`);
      }
      if (!fallbackResp.ok) throw new Error(`Сервер: ${fallbackResp.status}`);

      const data = await fallbackResp.json();
      const content = data.choices?.[0]?.message?.content;
      if (content) {
        onDelta(content);
      } else {
        throw new Error('Пустой ответ от сервера');
      }
    }
  }

  // ===== MISTRAL: БЕЗ stream:true (CORS блокирует) =====
  async function getMistralResponse(text, history, signal, onDelta) {
    const recentHistory = history.slice(-8).map(m => ({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content: m.content || ''
    }));

    if (recentHistory.length === 0 || recentHistory[recentHistory.length - 1].content !== text) {
      recentHistory.push({ role: 'user', content: text });
    }

    let response;
    try {
      response = await fetch("https://api.mistral.ai/v1/conversations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + MISTRAL_API_KEY
        },
        body: JSON.stringify({
          agent_id: MISTRAL_AGENT_ID,
          agent_version: 0,
          inputs: recentHistory
          // stream: true — НЕ ставим, Mistral блокирует браузерный стриминг через CORS
        }),
        signal
      });
    } catch (netErr) {
      if (netErr.name === 'AbortError') throw netErr;
      throw new Error('Сеть: Mistral недоступен (CORS или соединение). Переключись на Pollinations.');
    }

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`Mistral ${response.status}: ${errText.substring(0, 100)}`);
    }

    const data = await response.json();

    let content = '';
    if (data.outputs && data.outputs.length > 0) {
      const lastOutput = data.outputs[data.outputs.length - 1];
      content = lastOutput.content
        || (lastOutput.message && lastOutput.message.content)
        || '';
    } else if (data.choices && data.choices.length > 0) {
      content = data.choices[0].message?.content || '';
    }

    if (!content) throw new Error('Пустой ответ от Mistral');

    onDelta(content);
  }

  // ===== SSE-РИДЕР =====
  async function readSSEStream(response, onDelta, extractor) {
    if (!response.body) throw new Error('Стриминг не поддерживается');

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    const getDelta = extractor || ((json) => json.choices?.[0]?.delta?.content || '');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop();

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        let payload = null;
        if (line.startsWith('data:')) {
          payload = line.slice(5).trim();
        } else if (line.startsWith('{')) {
          payload = line;
        }
        if (!payload) continue;
        if (payload === '[DONE]') return;

        try {
          const json = JSON.parse(payload);
          const delta = getDelta(json);
          if (delta) onDelta(delta);
        } catch (e) { /* пропускаем */ }
      }
    }
  }

  function setSendButtonStop(stop) {
    if (stop) {
      sendBtn.classList.add('stop');
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
      sendBtn.onclick = stopGeneration;
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      sendBtn.onclick = send;
    }
  }

  function stopGeneration() {
    if (currentAbort) {
      currentAbort.abort();
      currentAbort = null;
    }
    setSendButtonStop(false);
  }

  // ===== ГЕНЕРАЦИЯ ИЗОБРАЖЕНИЙ =====
  async function generateImage(text, chat) {
    setSendButtonStop(true);
    imgCooldownUntil = Date.now() + IMG_COOLDOWN_MS;
    updatePhotoBtnState();

    const typing = document.createElement('div');
    typing.className = 'row bot';
    typing.innerHTML = '<div class="avatar">H</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(typing);
    scrollDown();
    showStatus("Создаю картинку... (может занять до 30 сек)");

    const myChatId = currentChatId;

    try {
      const englishPrompt = await translatePrompt(text);
      const url = generateImageUrl(englishPrompt);
      await loadImage(url);

      typing.remove();
      hideStatus();
      setSendButtonStop(false);

      if (currentChatId !== myChatId) return;

      chat.messages.push({ role: 'assistant', text: `Вот что получилось по запросу «${text}»:`, img: url });
      saveChats();
      addBotMessage(`Вот что получилось по запросу «${text}»:`, url, chat.messages.length - 1);
      
    } catch (e) {
      typing.remove();
      hideStatus();
      setSendButtonStop(false);
      
      if (currentChatId !== myChatId) return;

      addBotMessage(`Ошибка: ${e.message}`, null, null);
      
      imgCooldownUntil = 0;
      updatePhotoBtnState();
    }
  }

  function generateImageUrl(englishPrompt) {
    let prompt = englishPrompt;
    let model = selectedModel; 

    const lower = englishPrompt.toLowerCase();
    
    if (lower.includes('flag') || lower.includes('флаг') || lower.includes('флаги')) {
      if (lower.includes('russia') || lower.includes('russian') || lower.includes('росси') || lower.includes('рф')) {
        prompt = 'the national flag of Russia, a rectangular banner with three equal horizontal stripes: white on top, blue in the middle, red on the bottom, waving on a flagpole, photorealistic, clear sky background';
      } else if (lower.includes('usa') || lower.includes('american') || lower.includes('сша') || lower.includes('америк')) {
        prompt = 'the national flag of the USA, stars and stripes, waving on a flagpole, photorealistic';
      } else {
        prompt = 'a national flag, ' + prompt + ', waving on a flagpole, photorealistic, detailed fabric texture';
      }
    } 
    else if (lower.includes('dog') || lower.includes('puppy') || lower.includes('собак') || lower.includes('щен')) {
      prompt = 'a cute dog with fur, four paws, a tail, floppy ears, ' + prompt;
      prompt += ', natural lighting, sharp focus';
    } 
    else if (lower.includes('cat') || lower.includes('kitten') || lower.includes('kitty') || lower.includes('кот') || lower.includes('кошк')) {
      prompt = 'a cute fluffy cat with detailed fur, whiskers, paws, tail, ' + prompt;
      prompt += ', natural lighting, sharp focus';
    } 
    else {
      prompt += ', natural lighting, sharp focus, high quality';
    }

    if (lower.includes('logo') || lower.includes('vector')) {
      prompt += ', flat vector logo, minimalist, clean lines, solid white background, simple design, no text';
    } else if (lower.includes('art') || lower.includes('anime') || lower.includes('drawing')) {
      prompt += ', digital art, concept art, vivid colors, detailed';
    }

    return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&model=${model}&nologo=true&seed=${Math.floor(Math.random()*999999)}`;
  }

  function loadImage(url, timeout = 60000) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; reject(new Error('Таймаут')); } }, timeout);
      img.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(url); } };
      img.onerror = () => { if (!done) { done = true; clearTimeout(timer); reject(new Error('Ошибка загрузки')); } };
      img.src = url;
    });
  }

  async function translatePrompt(text) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=${encodeURIComponent(text)}`;
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('Translate failed');
      const data = await response.json();
      const translated = data[0].map(item => item[0]).join('');
      return translated || text;
    } catch (e) {
      return text;
    }
  }

  // ===== СТРИППЕР MARKDOWN =====
  function stripMarkdown(text) {
    const codeBlocks = [];
    let tmp = text.replace(/```[\s\S]*?```/g, (m) => {
      codeBlocks.push(m);
      return `\u0000CODE${codeBlocks.length - 1}\u0000`;
    });

    tmp = tmp.replace(/^\s*\|(.+)\|\s*$/gm, (line) => {
      const cells = line.split('|').map(c => c.trim()).filter(Boolean);
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) return '';
      return cells.join(' — ');
    });
    tmp = tmp.replace(/\*\*(.+?)\*\*/g, '$1');
    tmp = tmp.replace(/__(.+?)__/g, '$1');
    tmp = tmp.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2');
    tmp = tmp.replace(/(^|[^_])_([^_\n]+)_/g, '$1$2');
    tmp = tmp.replace(/^\s{0,3}#{1,6}\s+/gm, '');
    tmp = tmp.replace(/^\s*([-*_])\1{2,}\s*$/gm, '');
    tmp = tmp.replace(/`([^`\n]+)`/g, '$1');
    tmp = tmp.replace(/\n{3,}/g, '\n\n');

    tmp = tmp.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codeBlocks[parseInt(i, 10)]);

    return tmp.trim();
  }

  // ===== LIGHTBOX =====
  let currentImageSrc = '';
  function openLightbox(src) {
    currentImageSrc = src;
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }
  function closeLightbox() { lightbox.classList.remove('show'); }
  lightboxClose.onclick = closeLightbox;
  lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };

  downloadBtn.onclick = async () => {
    if (!currentImageSrc) return;
    downloadBtn.textContent = 'Загрузка...';
    downloadBtn.disabled = true;
    try {
      const response = await fetch(currentImageSrc);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `HHAI_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    } catch (e) {
      window.open(currentImageSrc, '_blank');
    }
    downloadBtn.textContent = 'Скачать';
    downloadBtn.disabled = false;
    closeLightbox();
  };

  sendBtn.onclick = send;

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  init();
})();
